<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="60%" stop-color="#F5E8D2"/>
      <stop offset="100%" stop-color="#E7D2B0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801C29"/>
      <stop offset="50%" stop-color="#5C131D"/>
      <stop offset="100%" stop-color="#3D0A12"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9"/>
      <stop offset="50%" stop-color="#C89D47"/>
      <stop offset="100%" stop-color="#9B7428"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#420D14" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Mandalas / Rangoli in background -->
  <g opacity="0.1" stroke="#9B7428" stroke-width="1.5" fill="none">
    <circle cx="300" cy="300" r="240"/>
    <circle cx="300" cy="300" r="180"/>
    <circle cx="300" cy="300" r="120"/>
    <path d="M 300 60 L 300 540 M 60 300 L 540 300 M 130 130 L 470 470 M 130 470 L 470 130"/>
  </g>

  <!-- Gift Box Outer (Hamper Base) with 3D perspective shadow -->
  <g filter="url(#softShadow)">
    <!-- Box Body -->
    <rect x="150" y="210" width="300" height="230" rx="16" fill="url(#boxGrad)" stroke="#C89D47" stroke-width="2"/>
    <!-- Box Lid -->
    <rect x="135" y="180" width="330" height="60" rx="10" fill="#731925" stroke="#E5C479" stroke-width="2"/>
    <rect x="135" y="230" width="330" height="10" fill="#3D0A12" opacity="0.4"/>

    <!-- Vertical Gold Ribbon -->
    <rect x="280" y="180" width="40" height="260" fill="url(#goldRibbon)"/>
    <!-- Horizontal Gold Ribbon on Box Body -->
    <rect x="150" y="310" width="300" height="36" fill="url(#goldRibbon)"/>
    
    <!-- Gold Ribbon Bow on Top -->
    <g transform="translate(300, 180)">
      <!-- Left Loop -->
      <path d="M0,0 C-40,-35 -80,-30 -80,-5 C-80,20 -30,5 0,0" fill="url(#goldRibbon)" stroke="#9B7428" stroke-width="1.5"/>
      <!-- Right Loop -->
      <path d="M0,0 C40,-35 80,-30 80,-5 C80,20 30,5 0,0" fill="url(#goldRibbon)" stroke="#9B7428" stroke-width="1.5"/>
      <!-- Ribbon Tails -->
      <path d="M-8,5 C-25,40 -40,70 -50,90 C-40,85 -25,92 -15,80 C-8,40 0,5 0,5" fill="url(#goldRibbon)"/>
      <path d="M8,5 C25,40 40,70 50,90 C40,85 25,92 15,80 C8,40 0,5 0,5" fill="url(#goldRibbon)"/>
      <!-- Bow Knot Center -->
      <circle cx="0" cy="0" r="14" fill="#F7E2A9" stroke="#9B7428" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#C89D47"/>
    </g>
  </g>

  <!-- Festive Diya Accent at bottom corner -->
  <g transform="translate(430, 430) scale(0.95)" filter="url(#softShadow)">
    <!-- Diya Base -->
    <path d="M10,25 C10,48 24,58 45,58 C66,58 80,48 80,25 C65,31 25,31 10,25 Z" fill="#9B7428"/>
    <path d="M14,27 C24,32 66,32 76,27 C72,44 60,54 45,54 C30,54 18,44 14,27 Z" fill="#C89D47"/>
    <!-- Flame Glow -->
    <circle cx="45" cy="12" r="16" fill="#FDEAA8" opacity="0.6"/>
    <!-- Flame Core -->
    <path d="M45,-2 C45,-2 56,12 56,19 C56,25 51,28 45,28 C39,28 34,25 34,19 C34,12 45,-2 45,-2 Z" fill="#E67E22"/>
    <path d="M45,4 C45,4 52,14 52,19 C52,23 49,25 45,25 C41,25 38,23 38,19 C38,14 45,4 45,4 Z" fill="#F1C40F"/>
  </g>

  <!-- Tag Ribbon: "Festive Diwali Gift Box" -->
  <g transform="translate(300, 490)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#5C131D" stroke="#C89D47" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#FDFBF7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">
      HANDCRAFTED DIWALI HAMPER
    </text>
  </g>
  
  <text x="300" y="540" text-anchor="middle" fill="#665348" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="0.5">
    The Home Delight Bakery • 100% Eggless
  </text>
</svg>
